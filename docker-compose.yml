version: "3.9"

services:
  # 1. Database Service
  db:
    image: postgres:15
    container_name: wearit_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. FastAPI Backend Service
  backend:
    build: ./backend
    container_name: wearit_backend
    restart: always
    depends_on:
      - db
    # Production mein hum iska port 8000 bahar expose nahi karenge,
    # kyunki saara traffic Nginx ke through andar aayega.
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app

  # 3. React Frontend + Nginx Proxy Service
  frontend:
    build: ./wearit-frontend
    container_name: wearit_frontend
    ports:
      - "81:80"
      - "443:443" # <-- HTTPS traffic ke liye port 443 kholo
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      # Server par jo abhi certificate bana hai, use container ke andar read-only map kar rahe hain
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  postgres_data: