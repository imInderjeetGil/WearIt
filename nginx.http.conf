# Port-80-only nginx config, for bringing the stack up BEFORE the Let's
# Encrypt certificate exists. Use it to run the app and/or obtain the cert
# (certbot --standalone needs port 80 free, so stop this service first):
#   sudo certbot certonly --standalone -d wearit.inderforge.app
# Once the cert exists, switch back to nginx.conf (full HTTPS).
#
# To use: replace the nginx.conf mount in docker-compose.prod.yml,
#   - ./nginx.http.conf:/etc/nginx/nginx.conf:ro

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 10m;

    server {
        listen 80;
        server_name wearit.inderforge.app;

        # Frontend (React SPA)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Backend API
        location /api/v1/ {
            rewrite ^/api/v1/(.*)$ /$1 break;
            proxy_pass http://wearit_backend:8000;

            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
