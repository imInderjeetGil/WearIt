name: CI/CD Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Jab bhi main branch par push hoga, ye pipeline chalegi

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/WearIt
            
            # Git ko bolenge ki local server par agar koi untracked ya modified files (jaise config) hain, toh pull se pehle unhe temporary side me rakhe ya ignore kare
            git stash --include-untracked
            
            # Fresh code pull karo
            git pull origin main
            
            # Pull hone ke baad agar koi cheez stash ki thi toh use wapas le aao (par .env wahin safe rahegi)
            git stash pop || true
            
            # Fresh build aur deploy
            docker compose down
            docker compose up -d --build