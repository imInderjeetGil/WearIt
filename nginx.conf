events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Product/profile image uploads can be a few MB each.
    client_max_body_size 10m;

    # 1. HTTP -> HTTPS auto-redirect
    server {
        listen 80;
        server_name wearit.inderforge.app;
        return 301 https://$host$request_uri;
    }

    # 2. Secure HTTPS server
    server {
        listen 443 ssl;
        server_name wearit.inderforge.app;

        # Canonical Certbot path on the host (mounted read-only into this
        # container at /etc/letsencrypt). Obtain the certificate BEFORE this
        # server starts — nginx will not boot if these files are missing:
        #   sudo certbot certonly --standalone -d wearit.inderforge.app
        # Until the cert exists, run with nginx.http.conf (port-80-only).
        ssl_certificate     /etc/letsencrypt/live/wearit.inderforge.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wearit.inderforge.app/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Frontend (React SPA) — served from the built dist/.
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Backend API — frontend calls /api/v1/...; nginx strips the prefix
        # and forwards the remainder to the FastAPI backend (internal only).
        location /api/v1/ {
            rewrite ^/api/v1/(.*)$ /$1 break;
            proxy_pass http://wearit_backend:8000;

            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
