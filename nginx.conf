server {
    listen 80;
    server_name localhost;

    # 1. Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend API Proxy (v1 ko handle karne ke liye)
    location /api/v1/ {
        # Isse /api/v1/users badal jayega /users mein aur backend ko milega
        rewrite ^/api/v1/(.*)$ /$1 break; 
        
        # NOTE: Agar docker-compose mein service ka naam 'wearit-backend' ya 'backend' hai, wahi likhna:
        proxy_pass http://wearit_backend:8000; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}