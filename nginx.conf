events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. HTTP se HTTPS par Auto-Redirect
    server {
        listen 80;
        server_name wearit.inderforge.app;
        return 301 https://$host$request_uri;
    }

    # 2. Secure HTTPS Server
    server {
        listen 443 ssl;
        server_name wearit.inderforge.app;

        # Certbot certificates ka sahi path container ke andar
        ssl_certificate /etc/letsencrypt/live/wearit.inderforge.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wearit.inderforge.app/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Frontend Config
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Backend API Config
        location /api/v1/ {
            rewrite ^/api/v1/(.*)$ /$1 break;
            proxy_pass http://wearit_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}