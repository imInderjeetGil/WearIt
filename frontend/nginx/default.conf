server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: let client-side routing handle deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Allow product/profile image uploads through the proxy (see nginx.conf).
    client_max_body_size 10m;
}
